name: CI

on:
  push:
    branches: [main, "graded941-*"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verve_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:auth
      - run: bun run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/verve_test
      - run: bun run build
